name: parchment
description: Announcement app for coursemates - Parchment
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Secure token storage (access/refresh tokens)
  flutter_secure_storage: ^9.2.2

  # Push notifications
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  # Routing
  go_router: ^14.2.0

  # Icons (Material 3 already ships with cupertino_icons by default)
  cupertino_icons: ^1.0.6

  # Date formatting (announcement timestamps in the feed)
  intl: ^0.19.0

  # Typography: Manrope (headings) + Inter (body/UI)
  google_fonts: ^6.2.1

  # SVG rendering for the logo mark
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Pin path_provider_android to a pre-JNI-migration version. Newer versions
# (2.3.x+) require a native CMake/NDK build via the jni/jni_flutter
# packages, which needs an x86_64 NDK toolchain that can't run on this
# ARM64 proot dev environment. 2.2.x uses plain Kotlin/MethodChannel -
# no native compilation needed. Pulled in transitively via
# flutter_secure_storage -> path_provider -> path_provider_android.
dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
